<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMBA</title>
    <link rel="stylesheet" href="../css/user.css">
</head>
<body>
    <div class="header">
        <h1 id="user"></h1>
        <a class="back-button">Volver</a>
    </div>
    <div class="container">
        <div class="section">
            <h2>Información Personal</h2>
            <form id="personalInfoForm">
                <div class="form-group">
                    <label for="firstName">Nombre:</label>
                    <input type="text" id="firstName" name="firstName">
                </div>
                <div class="form-group">
                    <label for="lastName">Apellidos:</label>
                    <input type="text" id="lastName" name="lastName">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </form>
        </div>

        <div class="section">
            <h2>Dirección</h2>
            <form id="addressForm">
                <div class="form-group">
                    <label for="address">Dirección:</label>
                    <input type="text" id="address" name="address">
                </div>
                <div class="form-group">
                    <label for="city">Ciudad:</label>
                    <input type="text" id="city" name="city">
                </div>
                <div class="form-group">
                    <label for="zip">Código Postal:</label>
                    <input type="text" id="zip" name="zip">
                </div>
            </form>
        </div>

        <div class="section">
            <h2>Contraseña</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword">
                </div>
            </form>
        </div>

        <div class="section" id="dissapear">
            <h2>Suscripción</h2>
            <form id="subForm">
                <div class="form-group">
                    <label for="subscriptionType">Tipo de suscripción:</label>
                    <input type="text" id="tipoSuscripcion" name="tipoSuscripcion" disabled>
                </div>
                <div class="form-group">
                    <label for="subscriptionStatus">Estado de la suscripción:</label>
                    <input type="text" id="estado" name="estado" disabled>
                </div>
                <div class="form-group">
                    <button type="button" id="cancelSubscriptionButton" class="cancel-button" onclick="confirmarBaja()">Dar de baja la suscripción</button>
                </div>
                <div class="decorative-line"></div>
            </form>
        </div>

        <button class="greenButton" type="button" id="saveButton">Guardar Cambios</button>
    </div>

    <div id="confirmationPopup" class="popup" style="display: none;">
        <div class="popup-overlay" onclick="cerrarPopup()"></div>
        <div class="popup-content" id="popupContent">
            <h3>¿Estás seguro que deseas dar de baja tu suscripción?</h3>
            <div class="button-container">
                <button onclick="darDeBaja()">Sí, dar de baja</button>
                <button onclick="cerrarPopup()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Contenedor para la alerta personalizada -->
    <div id="custom-alert" class="alert">
        <div class="alert-icon" id="alert-icon"></div>
        <div id="alert-message"></div>
        <button class="close-btn" onclick="closeAlert()">×</button>
    </div>
    <script src="../js/user.js"></script>
</body>
</html>
