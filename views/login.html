<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMBA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @font-face {
            font-family: 'RockSalt';
            src: url('../fonts/RockSalt-Regular.ttf');
        }
        body {
            margin: 0;
            font-family: 'RockSalt', sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #76c893;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }

        input::placeholder {
            color: #888;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            background-color: #76c893;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #76c893;
        }

        p {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        a {
            color: #76c893;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
        .alert {
            background-color: #333;
            color: #fff;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            width: 90%;
            max-width: 450px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.3s ease, visibility 0s 0.4s;
            position: fixed;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
        }

        .alert.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%); 
        }

        .alert.error {
            border-left: 5px solid #d32f2f; 
            background-color: #4c1c24; 
            color: #f44336;
        }

        .alert.success {
            border-left: 5px solid #388e3c;
            background-color: #2c6c42;
            color: #4caf50; 
        }

        .alert.warning {
            border-left: 5px solid #f57c00; 
            background-color: #3e2c1c; 
            color: #ff9800;
        }

        .alert-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            margin-left: 15px;
        }

        .alert.close {
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -50%) translateY(-20px); 
            transition: opacity 0.4s ease, transform 0.3s ease; 
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="auth-container">
        <h1>Iniciar Sesión</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p>¿No tienes una cuenta? <a href="#" id="create-account-link">Regístrate aquí</a></p>
        <p>¿Te has olvidado la contraseña? <a href="#" id="recover-password-link">RegístrateRecuperala aquí</a></p>
    </div>
    <!-- Contenedor para la alerta personalizada -->
    <div id="custom-alert" class="alert">
        <div class="alert-icon" id="alert-icon"></div>
        <div id="alert-message"></div>
        <button class="close-btn" onclick="closeAlert()">×</button>
    </div>
    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init('YQLoQwTiWkNbPpvMu')
    </script>
    <script src="../js/login.js"></script>
</body>
</html>
