<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel Dinámico con Botones Laterales</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff0099, #493240);
      overflow: hidden;
    }

    .carousel-container {
      position: relative;
      width: 80%;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main-slide {
      width: 90%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
    }

    .main-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 10px;
    }

    .button-container {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      padding: 0 5%;
    }

    .button-container img {
      pointer-events: auto;
      width: 8%;
      height: 60%;
      cursor: pointer;
      user-select: none;
      border-radius: 10px;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }

    .button-container img {
      background: linear-gradient(135deg, #ff0099, #493240);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="main-slide">
      <img src="sudadera.png" alt="Main Slide" class="main-image">
    </div>

    <div class="button-container">
      <img src="" alt="Prev" class="prev">
      <img src="" alt="Next" class="next">
    </div>
  </div>

  <script>
    const slides = [
      "img/cascoMoto.png",
      "img/sudadera.png",
      "img/cascoMoto.png",
      "img/sudadera.png",
    ];

    let currentIndex = 0;

    const mainImage = document.querySelector('.main-image');
    const prevButton = document.querySelector('.prev');
    const nextButton = document.querySelector('.next');

    function updateCarousel() {
      mainImage.src = slides[currentIndex];

      const prevIndex = (currentIndex - 1 + slides.length) % slides.length;
      const nextIndex = (currentIndex + 1) % slides.length;

      prevButton.src = slides[prevIndex];
      nextButton.src = slides[nextIndex];
    }

    nextButton.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % slides.length;
      updateCarousel();
    });

    prevButton.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateCarousel();
    });

    updateCarousel();
  </script>
</body>
</html>
