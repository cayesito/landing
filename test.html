<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #0f0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }

        input::placeholder {
            color: #888;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            background-color: #0f0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #00cc00;
        }

        .message {
            background-color: #0f0;
            color: #000;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            font-weight: bold;
            display: none;
        }

        p {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        a {
            color: #0f0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container" id="auth-container"></div>

    <script>
        const authContainer = document.getElementById('auth-container');

        function sendEmail(email) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve();
                }, 3000);
            });
        }

        function showLogin() {
            authContainer.innerHTML = `
                <h1>Iniciar Sesión</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <button type="submit" class="btn">Ingresar</button>
                </form>
                <p>¿No tienes una cuenta? <a href="#" id="create-account-link">Regístrate aquí</a></p>
            `;

            document.getElementById('create-account-link').addEventListener('click', function(event) {
                event.preventDefault();
                showRegister();
            });

            document.getElementById('login-form').addEventListener('submit', function(event) {
                event.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (username && password) {
                    window.location.href = "dashboard.html"; // Redirige a otra página
                } else {
                    alert('Por favor, completa todos los campos.');
                }
            });
        }

        function showRegister() {
            authContainer.innerHTML = `
                <h1>Crear Cuenta</h1>
                <form id="register-form">
                    <div class="form-group">
                        <label for="new-username">Usuario</label>
                        <input type="text" name="name_of" id="name_of" placeholder="Elige un usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" name="reply_to" id="reply_to" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Contraseña</label>
                        <input type="password" id="new-password" name="new-password" placeholder="Elige una contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required>
                    </div>
                    <button type="submit" class="btn">Crear Cuenta</button>
                </form>
                <p>¿Ya tienes una cuenta? <a href="#" id="back-to-login">Inicia sesión</a></p>
            `;

            document.getElementById('back-to-login').addEventListener('click', function(event) {
                event.preventDefault();
                showLogin();
            });

            document.getElementById('register-form').addEventListener('submit', async function(event) {
                event.preventDefault();
                const username = document.getElementById('name_of').value;
                const email = document.getElementById('reply_to').value;
                const password = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (password !== confirmPassword) {
                    alert('Las contraseñas no coinciden.');
                    return;
                }

                document.getElementById('register-form')
                .addEventListener('submit', function(event) {
                event.preventDefault();

                const serviceID = 'default_service';
                const templateID = 'template_npq3u3r';
                emailjs.sendForm(serviceID, templateID, this)
                    .then(() => {
                        alert('Sent!');
                    }, (err) => {
                        alert(JSON.stringify(err));
                        returnToStart()
                    });
                });
                await sendEmail(email);

                // Mostrar mensaje de cuenta creada
                authContainer.innerHTML = `
                    <div class="message">¡Cuenta creada exitosamente!</div>
                `;

                setTimeout(() => {
                    showLogin();
                }, 2000); // Regresar a inicio de sesión después de 2 segundos
            });
        }

        // Mostrar la pantalla de inicio de sesión al cargar
        showLogin();
    </script>
    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init('YQLoQwTiWkNbPpvMu')
    </script>
</body>
</html>
